name: Build demo image
description: Build the demo Docker image with the GitHub Actions layer cache, optionally pushing it to GHCR.
inputs:
  push:
    description: Push the image to GHCR.
    default: "false"
runs:
  using: composite
  steps:
    - id: settings
      shell: bash
      run: |
        echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        echo "node=$(cat .node-version)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ inputs.push }}
        build-args: NODE_VERSION=${{ steps.settings.outputs.node }}
        tags: |
          ${{ steps.settings.outputs.image }}:demo
          ${{ steps.settings.outputs.image }}:sha-${{ github.sha }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
